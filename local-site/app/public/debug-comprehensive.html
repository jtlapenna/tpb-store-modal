<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Comprehensive Modal Debug</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; background: #f5f5f5; }
        .debug-section { background: white; padding: 20px; margin: 20px 0; border-radius: 8px; }
        .test-button { background: #007cba; color: white; padding: 12px 24px; border: none; border-radius: 4px; cursor: pointer; margin: 10px; }
        .status { padding: 10px; margin: 10px 0; border-radius: 4px; font-family: monospace; }
        .success { background: #d4edda; color: #155724; }
        .error { background: #f8d7da; color: #721c24; }
        .info { background: #d1ecf1; color: #0c5460; }
    </style>
    <link rel="stylesheet" href="wp-content/plugins/tpb-quickview-modal/assets/css/modal.css">
</head>
<body>
    <h1>🔍 Comprehensive Modal Debug Test</h1>
    
    <div class="debug-section">
        <h2>1. File Loading Status</h2>
        <div id="file-status" class="status">Testing...</div>
    </div>
    
    <div class="debug-section">
        <h2>2. Handler Debug Info</h2>
        <div id="handler-debug" class="status">Loading...</div>
    </div>
    
    <div class="debug-section">
        <h2>3. Modal Test Buttons</h2>
        <button class="test-button" onclick="testDirectOpen()">Direct Open (JavaScript)</button>
        <button class="test-button" data-tpb-modal="true" href="flower-station-configure-now">Handler Open (data-tpb-modal)</button>
        <button class="test-button" data-tpb-quickview href="flower-station-configure-now">Handler Open (data-tpb-quickview)</button>
        <button class="test-button" href="flower-station-configure-now">Handler Open (href only)</button>
        <div id="modal-status" class="status">Ready to test</div>
    </div>
    
    <div class="debug-section">
        <h2>4. Console Output</h2>
        <div id="console-output" style="background: #f8f9fa; padding: 10px; border-radius: 4px; font-family: monospace; white-space: pre-wrap; max-height: 300px; overflow-y: auto;"></div>
    </div>

    <!-- Modal HTML -->
    <div id="tpb-qv-flower-modal" class="tpb-qv-overlay" style="display: none;">
        <div class="tpb-qv-modal">
            <button class="tpb-qv-close" aria-label="Close modal">&times;</button>
            <div class="tpb-qv-left-panel">
                <div id="tpb-qv-product-image">
                    <img src="https://via.placeholder.com/400x300/4CAF50/white?text=Flower+Station" alt="Flower Station" style="width: 100%; height: auto; border-radius: 8px;">
                </div>
            </div>
            <div class="tpb-qv-right-panel">
                <h2 class="tpb-qv-title">Configure Your Flower Stations</h2>
                <div id="tpb-qv-base-price" class="tpb-qv-base-price">
                    Please choose a SKU-count to see the base-price for electronics hardware.
                </div>
                <div id="tpb-qv-stepper-container" class="tpb-qv-stepper-container" data-modal-type="flower-station">
                    <div style="padding: 20px; text-align: center; color: #666;">
                        Stepper content would load here
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="wp-content/plugins/tpb-quickview-modal/assets/js/modal-flower-handler.js"></script>
    
    <script>
        // Test configuration
        window.TPB_QV_CONFIG = {
            home_url: 'http://the-peak-beyond-modal.local/',
            qv_param: 'tpb_qv_iframe',
            ajax_url: '/wp-admin/admin-ajax.php',
            nonce: 'test-nonce',
            cpb_enabled: false,
            plugin_url: 'wp-content/plugins/tpb-quickview-modal/',
            debug: true
        };
        
        // Capture console output
        const originalLog = console.log;
        const originalError = console.error;
        const consoleOutput = document.getElementById('console-output');
        
        function addToConsole(message, type = 'log') {
            const timestamp = new Date().toLocaleTimeString();
            const prefix = type === 'error' ? '❌' : '✅';
            consoleOutput.textContent += `[${timestamp}] ${prefix} ${message}\n`;
            consoleOutput.scrollTop = consoleOutput.scrollHeight;
        }
        
        console.log = function(...args) {
            originalLog.apply(console, args);
            addToConsole(args.join(' '), 'log');
        };
        
        console.error = function(...args) {
            originalError.apply(console, args);
            addToConsole(args.join(' '), 'error');
        };
        
        function testFileLoading() {
            const status = document.getElementById('file-status');
            const tests = [
                { name: 'jQuery', test: () => typeof $ !== 'undefined' },
                { name: 'Flower Handler', test: () => typeof window.TPBFlowerModal !== 'undefined' },
                { name: 'TPB_QV_CONFIG', test: () => typeof window.TPB_QV_CONFIG !== 'undefined' },
                { name: 'Modal CSS', test: () => document.querySelector('link[href*="modal.css"]') !== null },
                { name: 'Modal HTML', test: () => document.getElementById('tpb-qv-flower-modal') !== null }
            ];
            
            let results = [];
            let allPassed = true;
            
            tests.forEach(test => {
                try {
                    const passed = test.test();
                    results.push(`${passed ? '✅' : '❌'} ${test.name}: ${passed ? 'LOADED' : 'MISSING'}`);
                    if (!passed) allPassed = false;
                } catch (e) {
                    results.push(`❌ ${test.name}: ERROR - ${e.message}`);
                    allPassed = false;
                }
            });
            
            status.innerHTML = results.join('<br>');
            status.className = `status ${allPassed ? 'success' : 'error'}`;
        }
        
        function testHandlerDebug() {
            const status = document.getElementById('handler-debug');
            let info = [];
            
            if (window.TPBFlowerModal) {
                info.push('✅ TPBFlowerModal object exists');
                info.push(`✅ Has init method: ${typeof window.TPBFlowerModal.init === 'function'}`);
                info.push(`✅ Has openModal method: ${typeof window.TPBFlowerModal.openModal === 'function'}`);
                info.push(`✅ Has closeModal method: ${typeof window.TPBFlowerModal.closeModal === 'function'}`);
                
                // Test if handler is initialized
                if (window.TPBFlowerModal.init) {
                    try {
                        window.TPBFlowerModal.init();
                        info.push('✅ Handler init() called successfully');
                    } catch (e) {
                        info.push(`❌ Handler init() failed: ${e.message}`);
                    }
                }
            } else {
                info.push('❌ TPBFlowerModal object not found');
            }
            
            status.innerHTML = info.join('<br>');
            status.className = `status ${info.some(i => i.includes('❌')) ? 'error' : 'success'}`;
        }
        
        function testDirectOpen() {
            console.log('Testing direct modal open');
            const modal = document.getElementById('tpb-qv-flower-modal');
            if (modal) {
                modal.style.display = 'flex';
                modal.classList.add('is-open');
                document.getElementById('modal-status').textContent = 'Direct open successful';
                document.getElementById('modal-status').className = 'status success';
            } else {
                document.getElementById('modal-status').textContent = 'Modal not found';
                document.getElementById('modal-status').className = 'status error';
            }
        }
        
        // Test modal triggers
        document.addEventListener('click', function(e) {
            if (e.target.matches('[data-tpb-modal="true"], [data-tpb-quickview], a[href*="flower-station-configure-now"]')) {
                console.log('Trigger button clicked:', e.target);
                console.log('Button attributes:', {
                    'data-tpb-modal': e.target.getAttribute('data-tpb-modal'),
                    'data-tpb-quickview': e.target.getAttribute('data-tpb-quickview'),
                    'href': e.target.getAttribute('href')
                });
                
                // Test if handler would catch this
                if (window.TPBFlowerModal && window.TPBFlowerModal.openModal) {
                    console.log('Calling handler openModal directly');
                    try {
                        window.TPBFlowerModal.openModal(e.target.getAttribute('href') || 'test-url');
                    } catch (error) {
                        console.error('Handler openModal failed:', error);
                    }
                } else {
                    console.error('Handler or openModal method not available');
                }
            }
        });
        
        // Run tests when page loads
        document.addEventListener('DOMContentLoaded', function() {
            console.log('🔍 Comprehensive Modal Debug Test Page Loaded');
            testFileLoading();
            testHandlerDebug();
        });
    </script>
</body>
</html>
