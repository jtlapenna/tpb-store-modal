; TPB Store Modal - Local PHP Configuration Override
; This file overrides system PHP settings for this directory

; File Upload Settings
upload_max_filesize = 2048M
post_max_size = 2048M
max_file_uploads = 50

; Execution Settings
max_execution_time = 0
max_input_time = -1
memory_limit = 2048M

; Additional Settings
max_input_vars = 10000
max_input_nesting_level = 64
default_socket_timeout = 600







